<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chamunda Wines | Immortal Edition</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<style>

*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Poppins',sans-serif;
  background:#0b0b0b;
  color:white;
  overflow-x:hidden;
}
section{padding:120px 10%;}

h1,h2{font-family:'Playfair Display',serif;}

.gold{
  background:linear-gradient(90deg,#d4af37,#fff6b7,#d4af37);
  background-size:200% auto;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* PRELOADER */
#loader{
  position:fixed;
  inset:0;
  background:black;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:3000;
  font-size:40px;
}

/* NAV */
nav{
  position:fixed;
  width:100%;
  top:0;
  padding:20px 8%;
  display:flex;
  justify-content:space-between;
  background:rgba(0,0,0,0.4);
  backdrop-filter:blur(10px);
  z-index:1000;
}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 10%;
}

.hero-text{
  max-width:500px;
}

.hero h1{font-size:60px;}

.hero-img{
  perspective:1000px;
}

.hero-img img{
  width:350px;
  transform-style:preserve-3d;
  animation:float 4s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:rotateY(-15deg) translateY(0);}
  50%{transform:rotateY(15deg) translateY(-20px);}
}

/* BUTTON */
.btn{
  margin-top:20px;
  padding:14px 35px;
  border-radius:40px;
  background:#8b0000;
  border:none;
  color:white;
  cursor:pointer;
  transition:0.3s;
}
.btn:hover{background:#d4af37;color:black;}

/* PRODUCTS SLIDER */
.slider{
  display:flex;
  overflow:hidden;
  position:relative;
}

.slide{
  min-width:100%;
  transition:0.6s;
  text-align:center;
}

.slide img{
  width:300px;
  border-radius:20px;
}

.slider-buttons{
  text-align:center;
  margin-top:20px;
}

.slider-buttons button{
  margin:5px;
  padding:8px 15px;
  border:none;
  cursor:pointer;
}

/* WHATSAPP */
.whatsapp{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#25D366;
  padding:15px;
  border-radius:50%;
  font-size:24px;
  color:white;
  text-decoration:none;
}

/* CONTACT */
.contact{
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(10px);
  border-radius:20px;
  padding:50px;
}

</style>
</head>
<body>

<div id="loader" class="gold">Chamunda Wines</div>

<nav>
  <div class="gold">Chamunda Wines</div>
  <div>Luxury Since 2026</div>
</nav>

<section class="hero">
  <div class="hero-text">
    <h1 class="gold">Crafted for Royal Taste</h1>
    <p>Premium Wines & Spirits in Rajasthan</p>
    <button class="btn">Explore Collection</button>
  </div>
  <div class="hero-img">
    <img src="https://images.unsplash.com/photo-1524592094714-0f0654e20314?auto=format&fit=crop&w=600&q=80">
  </div>
</section>

<section>
  <h2 class="gold">Featured Collection</h2>

  <div class="slider">
    <div class="slide"><img src="https://images.unsplash.com/photo-1510626176961-4b37d0b0d8f2"><h3>Premium Red Wine</h3></div>
    <div class="slide"><img src="https://images.unsplash.com/photo-1580910051074-3eb694886505"><h3>Luxury Whiskey</h3></div>
    <div class="slide"><img src="https://images.unsplash.com/photo-1566478989037-eec170784d0b"><h3>Exclusive Vodka</h3></div>
  </div>

  <div class="slider-buttons">
    <button onclick="prevSlide()">Prev</button>
    <button onclick="nextSlide()">Next</button>
  </div>
</section>

<section>
  <div class="contact">
    <h2 class="gold">Visit Chamunda Wines</h2>
    <p>Rajasthan’s Premium Liquor Destination.</p>
  </div>
</section>

<a href="https://wa.me/919999999999" class="whatsapp">💬</a>

<script>

gsap.registerPlugin(ScrollTrigger);

/* PRELOADER */
gsap.to("#loader",{opacity:0,duration:2,delay:1,onComplete:()=>{
  document.getElementById("loader").style.display="none";
}});

/* HERO ANIMATION */
gsap.from(".hero-text",{x:-100,opacity:0,duration:1.5});
gsap.from(".hero-img",{x:100,opacity:0,duration:1.5});

/* SCROLL COLOR MORPH */
gsap.to("body",{
  backgroundColor:"#111",
  scrollTrigger:{
    trigger:".slider",
    start:"top center",
    scrub:true
  }
});

/* SLIDER */
let current=0;
const slides=document.querySelectorAll(".slide");

function showSlide(index){
  slides.forEach((slide,i)=>{
    slide.style.transform=`translateX(${100*(i-index)}%)`;
  });
}
function nextSlide(){current=(current+1)%slides.length;showSlide(current);}
function prevSlide(){current=(current-1+slides.length)%slides.length;showSlide(current);}
showSlide(current);

</script>

</body>
  </html>
