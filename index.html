<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chamunda Wines | Comic Mode</title>

<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<style>

*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Poppins',sans-serif;
  background:#fff8e7;
  overflow-x:hidden;
}

/* COMIC HEADINGS */
h1,h2{
  font-family:'Bangers',cursive;
  letter-spacing:3px;
}

/* HERO */
.hero{
  height:100vh;
  background:radial-gradient(circle,#ff0000 20%,#b30000 100%);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  color:white;
  position:relative;
}

.hero h1{
  font-size:80px;
  text-shadow:4px 4px 0px #000;
}

.burst{
  position:absolute;
  font-family:'Bangers',cursive;
  font-size:60px;
  color:yellow;
  text-shadow:3px 3px 0 #000;
}

/* PANELS */
.panel{
  padding:120px 10%;
  border-bottom:8px solid black;
  position:relative;
}

.panel:nth-child(even){
  background:#ffe600;
}

.panel:nth-child(odd){
  background:#00d9ff;
}

.panel h2{
  font-size:50px;
  text-shadow:3px 3px 0 black;
}

.product-card{
  margin-top:40px;
  background:white;
  border:5px solid black;
  padding:20px;
  display:inline-block;
  transform:rotate(-2deg);
  box-shadow:8px 8px 0 black;
}

.product-card img{
  width:250px;
  display:block;
}

.speech{
  position:absolute;
  background:white;
  padding:15px 25px;
  border:4px solid black;
  border-radius:20px;
  font-family:'Bangers',cursive;
  font-size:25px;
  transform:rotate(5deg);
}

/* WHATSAPP */
.whatsapp{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#25D366;
  padding:15px;
  border-radius:50%;
  font-size:24px;
  text-decoration:none;
  color:white;
  box-shadow:3px 3px 0 black;
}

</style>
</head>
<body>

<section class="hero">
  <h1>CHAMUNDA WINES</h1>
  <div class="burst" style="top:20%;left:15%;">BOOM!</div>
  <div class="burst" style="bottom:20%;right:15%;">POW!</div>
</section>

<section class="panel">
  <h2>THE LEGEND BEGINS...</h2>
  <div class="speech" style="top:20px;right:20px;">Premium Power!</div>
  <div class="product-card">
    <img src="https://images.unsplash.com/photo-1510626176961-4b37d0b0d8f2">
    <h3>Red Wine</h3>
  </div>
</section>

<section class="panel">
  <h2>WHISKEY WARRIOR</h2>
  <div class="speech" style="bottom:20px;left:20px;">Unleash Flavor!</div>
  <div class="product-card">
    <img src="https://images.unsplash.com/photo-1580910051074-3eb694886505">
    <h3>Luxury Whiskey</h3>
  </div>
</section>

<section class="panel">
  <h2>VODKA VICTORY</h2>
  <div class="speech" style="top:20px;left:20px;">Smooth Strike!</div>
  <div class="product-card">
    <img src="https://images.unsplash.com/photo-1566478989037-eec170784d0b">
    <h3>Exclusive Vodka</h3>
  </div>
</section>

<a href="https://wa.me/919999999999" class="whatsapp">💬</a>

<script>

gsap.registerPlugin(ScrollTrigger);

/* HERO ANIMATION */
gsap.from(".hero h1",{scale:0,rotation:360,duration:1.5});
gsap.from(".burst",{opacity:0,y:-100,stagger:0.3,duration:1});

/* PANEL ANIMATION */
gsap.utils.toArray(".panel").forEach(panel=>{
  gsap.from(panel,{
    scrollTrigger:{
      trigger:panel,
      start:"top 80%"
    },
    x:-200,
    opacity:0,
    duration:1
  });
});

/* PRODUCT POP EFFECT */
gsap.utils.toArray(".product-card").forEach(card=>{
  gsap.from(card,{
    scrollTrigger:{
      trigger:card,
      start:"top 85%"
    },
    scale:0,
    rotation:20,
    duration:0.8
  });
});

</script>

</body>
      </html>
