<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chamunda Wines | Anime Mode</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<style>

*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Poppins',sans-serif;
  background:linear-gradient(to bottom,#1a1a2e,#16213e,#0f3460);
  color:white;
  overflow-x:hidden;
}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  position:relative;
  overflow:hidden;
}

.hero h1{
  font-family:'Orbitron',sans-serif;
  font-size:70px;
  background:linear-gradient(90deg,#ff00cc,#3333ff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  text-shadow:0 0 20px rgba(255,0,200,0.6);
}

.hero p{
  margin-top:20px;
  font-size:18px;
  opacity:0.9;
}

/* ENERGY BUTTON */
.btn{
  margin-top:30px;
  padding:14px 40px;
  border-radius:50px;
  border:none;
  font-size:16px;
  background:linear-gradient(90deg,#ff00cc,#3333ff);
  color:white;
  cursor:pointer;
  position:relative;
  overflow:hidden;
}

.btn::before{
  content:'';
  position:absolute;
  top:-50%;
  left:-50%;
  width:200%;
  height:200%;
  background:radial-gradient(circle,rgba(255,255,255,0.4) 10%,transparent 60%);
  transform:rotate(45deg);
  animation:energy 3s linear infinite;
}

@keyframes energy{
  0%{transform:translateX(-100%) rotate(45deg);}
  100%{transform:translateX(100%) rotate(45deg);}
}

/* FLOATING GLASS SECTION */
.section{
  padding:120px 10%;
  text-align:center;
}

.card{
  margin-top:40px;
  display:inline-block;
  background:rgba(255,255,255,0.1);
  backdrop-filter:blur(10px);
  border-radius:20px;
  padding:30px;
  box-shadow:0 0 30px rgba(255,0,200,0.3);
  transform:translateY(50px);
  opacity:0;
}

.card img{
  width:250px;
  border-radius:15px;
}

/* Sakura Petals */
.petal{
  position:absolute;
  width:15px;
  height:15px;
  background:pink;
  border-radius:50%;
  opacity:0.8;
  animation:fall linear infinite;
}

@keyframes fall{
  0%{transform:translateY(-10vh) rotate(0deg);}
  100%{transform:translateY(110vh) rotate(360deg);}
}

/* WhatsApp */
.whatsapp{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#25D366;
  padding:15px;
  border-radius:50%;
  font-size:24px;
  text-decoration:none;
  color:white;
}

</style>
</head>
<body>

<section class="hero">
  <h1>Chamunda Wines</h1>
  <p>Where Flavor Meets Destiny</p>
  <button class="btn">Enter the Realm</button>
</section>

<section class="section">
  <h2>Premium Collection</h2>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1510626176961-4b37d0b0d8f2">
    <h3>Crimson Red Wine</h3>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1580910051074-3eb694886505">
    <h3>Shadow Whiskey</h3>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1566478989037-eec170784d0b">
    <h3>Frost Vodka</h3>
  </div>

</section>

<a href="https://wa.me/919999999999" class="whatsapp">💬</a>

<script>

gsap.registerPlugin(ScrollTrigger);

/* HERO ANIMATION */
gsap.from(".hero h1",{y:-100,opacity:0,duration:1.5});
gsap.from(".hero p",{opacity:0,duration:1.5,delay:0.5});
gsap.from(".btn",{scale:0,opacity:0,duration:1,delay:1});

/* CARD ANIMATION */
gsap.utils.toArray(".card").forEach(card=>{
  gsap.to(card,{
    scrollTrigger:{
      trigger:card,
      start:"top 85%"
    },
    y:0,
    opacity:1,
    duration:1
  });
});

/* SAKURA GENERATOR */
for(let i=0;i<25;i++){
  let petal=document.createElement("div");
  petal.classList.add("petal");
  petal.style.left=Math.random()*100+"vw";
  petal.style.animationDuration=(5+Math.random()*5)+"s";
  petal.style.opacity=Math.random();
  document.body.appendChild(petal);
}

</script>

</body>
  </html>
